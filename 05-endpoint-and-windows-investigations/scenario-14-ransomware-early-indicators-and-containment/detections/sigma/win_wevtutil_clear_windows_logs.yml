title: Windows Event Log Cleared with Wevtutil
id: e9aa2831-c3fa-4083-ab6d-ef9ba7dbfb45
status: stable
description: Detects wevtutil commands that clear Windows event logs. Correlate multiple log names within 60 seconds for high severity.
author: Pam Lee
date: 2026-08-06
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\wevtutil.exe'
  selection_command:
    CommandLine|contains:
      - ' cl '
      - ' clear-log '
  selection_log:
    CommandLine|contains:
      - 'System'
      - 'Application'
      - 'Security'
  condition: selection_image and selection_command and selection_log
falsepositives:
  - Documented troubleshooting or lab-reset procedures
level: high
tags:
  - attack.defense-evasion
  - attack.t1070.001
