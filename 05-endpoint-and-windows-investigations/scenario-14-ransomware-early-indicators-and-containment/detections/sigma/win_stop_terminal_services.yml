title: Terminal Services Stop Command
id: d76452fb-5161-45cf-9fc3-bf8918183dfd
status: experimental
description: Detects commands attempting to stop the Windows Terminal Services service.
author: Pam Lee
date: 2026-08-06
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
      - '\sc.exe'
  selection_command:
    CommandLine|contains|all:
      - 'stop'
      - 'termservice'
  condition: selection_image and selection_command
falsepositives:
  - Approved RDP maintenance
level: medium
tags:
  - attack.impact
  - attack.t1489
