title: Windows Member Added to a Privileged Security Group
id: 7b4da6f1-09d9-48c8-a7b1-bd5952d8707e
status: experimental
description: >-
  Detects additions to selected high-privilege Windows global, local/domain-local,
  or universal security groups. Validate the actor, target member, group SID,
  change approval, and subsequent use before assigning malicious intent.
references:
  - https://attack.mitre.org/techniques/T1098/007/
  - https://attack.mitre.org/detectionstrategies/DET0310/
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4732
author: Pam Lee
date: 2026-08-02
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.007
logsource:
  product: windows
  service: security
detection:
  selection_event:
    EventID:
      - 4728
      - 4732
      - 4756
  selection_group:
    TargetUserName|contains:
      - Administrators
      - Domain Admins
      - Enterprise Admins
      - Schema Admins
      - Account Operators
      - Server Operators
      - Backup Operators
      - DnsAdmins
  condition: selection_event and selection_group
fields:
  - Computer
  - SubjectUserSid
  - SubjectUserName
  - SubjectDomainName
  - SubjectLogonId
  - MemberSid
  - MemberName
  - TargetSid
  - TargetUserName
  - TargetDomainName
falsepositives:
  - Approved identity lifecycle or just-in-time access workflow
  - Approved domain join, software deployment, backup, or administrative automation
  - Controlled security test with verified scope and cleanup
level: high
