title: Microsoft Authenticator Denial or Timeout
name: entra_mfa_failure
id: 6f2040aa-fc69-4d46-bec1-d079ce2d3468
status: experimental
description: Base event for a Microsoft Authenticator denial or timeout. Field names require mapping to the target identity schema.
author: Pam Lee
date: 2026-08-15
logsource:
  category: authentication
  product: azure
detection:
  selection:
    authentication_method|contains: Microsoft Authenticator
    authentication_outcome:
      - denied
      - timeout
  condition: selection
falsepositives:
  - Authenticator connectivity issues
  - Legitimate re-enrollment
  - Repeated user mistakes
level: low
tags:
  - attack.credential_access
  - attack.t1621
---
title: Successful Microsoft Authenticator MFA Sign-in
name: entra_mfa_success
id: 11f012e6-64af-4c9c-80e2-39a04f587e9d
status: experimental
description: Base event for a successful sign-in whose Microsoft Authenticator MFA step completed.
author: Pam Lee
date: 2026-08-15
logsource:
  category: authentication
  product: azure
detection:
  selection:
    authentication_method|contains: Microsoft Authenticator
    authentication_outcome: success
    signin_result: success
  condition: selection
level: low
---
title: Multiple MFA Denials or Timeouts for Same User and Source
name: entra_mfa_failure_burst
id: 1d78882e-8f0e-459b-a909-a9eaf6f2e75c
status: experimental
description: Correlates at least three Authenticator denials or timeouts for the same user and source within 15 minutes.
author: Pam Lee
date: 2026-08-15
correlation:
  type: event_count
  rules:
    - entra_mfa_failure
  group-by:
    - user
    - source_ip
  timespan: 15m
  condition:
    gte: 3
level: medium
---
title: MFA Failure Burst Followed by Successful Sign-in
id: 7f46ab06-0581-4cc3-a768-12b2348b7071
status: experimental
description: Correlates an MFA denial or timeout burst followed by a successful Authenticator sign-in for the same user and source within 15 minutes.
author: Pam Lee
date: 2026-08-15
correlation:
  type: temporal_ordered
  rules:
    - entra_mfa_failure_burst
    - entra_mfa_success
  group-by:
    - user
    - source_ip
  timespan: 15m
falsepositives:
  - Authenticator connectivity issues followed by a legitimate sign-in
  - Legitimate re-enrollment or device migration
  - Repeated user mistakes
level: high
tags:
  - attack.credential_access
  - attack.t1621
