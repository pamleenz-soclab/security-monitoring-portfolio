status: experimental
author: security-monitoring-portfolio Scenario 19
date: '2026-08-07'
references: []
title: R19-02 Suspicious Child of SYSTEM PowerShell Task Primitive
id: b29a3abc-9483-4f82-89b0-3e0f5b81d9aa
description: Process primitive for R19-02 correlated branch B; correlate with Task
  Scheduler launch context separately.
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith: \powershell.exe
  selection_child:
    Image|endswith:
    - \csc.exe
    - \mshta.exe
    - \regsvr32.exe
    - \rundll32.exe
  condition: selection_parent and selection_child
falsepositives:
- Developer/build or administration workflows; require task/SYSTEM correlation and
  context.
level: medium
tags:
- attack.execution
- attack.t1059.001
