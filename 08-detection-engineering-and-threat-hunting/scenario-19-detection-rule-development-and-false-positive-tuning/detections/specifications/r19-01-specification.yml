rule_id: R19-01
name: Repeated MFA Denial or Timeout Followed by Successful Authentication
version: 3.0.0
detects: Repeated MFA denial/timeout pressure followed by a successful authentication
  for the same user and source IP.
does_not_detect: All MFA failures, all successful sign-ins, or session-token theft
  by itself.
mandatory_fields:
- event_time
- user_name_or_alias
- source_ip
- event_outcome
- event_action/category indicating MFA
strong_fields:
- session_id
- correlation_id
- request_id
- device
- country
- Conditional Access/risk
logic: Anchor on each successful authentication. Count denied/timeout MFA steps for
  the same user+source_ip in the preceding 15 minutes. Match when count >= 3.
alert_entity: User + source IP
threshold: 3 failures
window: 15m
dedup: Use native sign-in/MFA record IDs when available before counting.
severity: High
confidence: Medium-High
tuning: Do not require SessionId. Use device/network/approved-access context for enrichment
  or governed suppression after match.
risk: Legitimate repeated denials followed by success are Benign Positives; shared
  VPN/NAT source IP is not sufficient grouping without user identity.
attack:
- T1621
response: Verify user approval, device, IP/ASN, Conditional Access, risk detections,
  and follow-on session activity.
test_status: Tested with local canonical evaluator and public fixture suite; source-derived
  validation references reviewed
platform_status: No native SIEM execution; platform files are syntax/semantic candidates
  only
performance_status: Not tested
